<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CloudGate Client - Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
  :root {
    --bg-0: #0b0b12; --glass: rgba(255,255,255,0.06); --glass-border: rgba(255,255,255,0.14);
    --text: #f3f3f7; --text-dim: #a3a3b3; --accent: #7c6df2; --purple: #A142F4;
    --blue: #4285F4; --red: #EA4335; --yellow: #FBBC05; --green: #34A853; --danger: #f2695f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-0); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.35; z-index: 0; }
  .blob.b1 { width: 480px; height: 480px; background: var(--blue); top: -140px; left: -100px; }
  .blob.b2 { width: 460px; height: 460px; background: var(--red); bottom: -160px; right: -120px; opacity: 0.28; }
  .card {
    position: relative; z-index: 1; width: 380px; max-width: 92vw;
    background: var(--glass); backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--glass-border); border-radius: 20px; padding: 32px 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35); text-align: center;
  }
  .logo { width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 0 0 22px; }
  button {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: white; color: #1f1f1f; border: none; border-radius: 999px;
    padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { margin-top: 16px; font-size: 12px; color: var(--text-dim); min-height: 16px; }
  #status.error { color: var(--danger); }
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="card">
  <div class="logo"><i class="fa-solid fa-cloud"></i></div>
  <h1>Reconnect to CloudGate</h1>
  <p>Your stored session stopped working. Sign in with the same Google account to reconnect this client - no CloudGate password needed, this just refreshes the session token.</p>
  <button id="google-btn"><i class="fa-brands fa-google"></i> Sign in with Google</button>
  <div id="status"></div>
</div>
<script>
(async function () {
  const cfg = await fetch("/api/login-config").then(r => r.json());
  firebase.initializeApp({
    apiKey: cfg.apiKey,
    authDomain: cfg.projectId + ".firebaseapp.com",
    projectId: cfg.projectId,
  });

  const btn = document.getElementById("google-btn");
  const status = document.getElementById("status");

  btn.onclick = async () => {
    btn.disabled = true;
    status.className = "";
    status.textContent = "Opening Google sign-in...";
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await firebase.auth().signInWithPopup(provider);
      const user = result.user;
      status.textContent = "Reconnecting...";
      const res = await fetch("/api/reauth", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email: user.email, refresh_token: user.refreshToken}),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || "Reauth failed");
      status.textContent = "Signed in - redirecting...";
      setTimeout(() => { window.location.href = "/"; }, 900);
    } catch (e) {
      status.className = "error";
      status.textContent = e.message || "Sign-in failed";
      btn.disabled = false;
    }
  };
})();
</script>
</body>
</html>
